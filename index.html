<style>
  :root {
    --ink: #0d2e26; --paper: #fdf6e9; --paper-2: #f4e9d1;
    --accent: #c95d2e; --accent-2: #f5a524;
    --jade: #2d6b5a; --sea: #1e5f7e;
    --mute: #7a7260; --line: #d4c39a; --gold: #b08838;
    --plane: #6d4c8f; --hotel: #a6512e;
    --booked: #c8a94a; --lotus: #e87ba0;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--paper); color: var(--ink); font-family: 'Fraunces', serif; -webkit-font-smoothing: antialiased; overscroll-behavior: none; height: 100%; }
  body { min-height: 100vh; min-height: 100dvh; }

  .app { display: grid; grid-template-rows: auto 1fr auto 1fr; height: 100vh; height: 100dvh; overflow: hidden; }

  .top {
    padding: calc(10px + var(--safe-top)) 16px 10px;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
    background-image: radial-gradient(circle at 10% 20%, rgba(245,165,36,.08) 0%, transparent 60%), radial-gradient(circle at 90% 80%, rgba(45,107,90,.06) 0%, transparent 60%);
  }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand { font-family: 'Instrument Serif', serif; font-size: 26px; font-weight: 400; line-height: 1; letter-spacing: -.02em; }
  .brand em { font-style: italic; color: var(--accent); }
  .brand .v { font-size: 10px; color: var(--mute); font-style: normal; vertical-align: super; margin-left: 4px; font-family: 'JetBrains Mono', monospace; letter-spacing: .1em; }
  .dates { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--mute); text-align: right; }
  .dates strong { color: var(--ink); font-weight: 500; }
  .progress-wrap { margin-top: 8px; display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .15em; text-transform: uppercase; color: var(--mute); }
  .progress-bar { flex: 1; height: 3px; background: var(--paper-2); position: relative; overflow: hidden; border: 1px solid var(--line); }
  .progress-fill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); width: 0%; transition: width .6s cubic-bezier(.2,.8,.2,1); }
  .reset-btn { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .15em; text-transform: uppercase; background: transparent; border: 1px solid var(--line); padding: 3px 8px; color: var(--mute); cursor: pointer; }

  .draft-banner { background: var(--accent-2); color: var(--ink); padding: 8px 16px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .15em; text-align: center; margin-bottom: 8px; }

  .map-wrap { position: relative; overflow: hidden; min-height: 0; }
  #map { width: 100%; height: 100%; background: #c8dde0; }
  .leaflet-container { font-family: 'Fraunces', serif; background: #c8dde0; }
  .leaflet-popup-content-wrapper { border-radius: 2px; background: var(--paper); border: 1px solid var(--line); box-shadow: 0 4px 12px rgba(0,0,0,.15); }
  .leaflet-popup-content { margin: 8px 12px; font-size: 12px; font-weight: 500; }
  .leaflet-popup-tip { background: var(--paper); border: 1px solid var(--line); }

  .map-marker { background: transparent; border: none; }
  .pin { width: 26px; height: 26px; background: var(--accent); border: 2px solid var(--paper); border-radius: 50% 50% 50% 0; transform: rotate(-45deg); display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 6px rgba(0,0,0,.25); }
  .pin-num { transform: rotate(45deg); color: var(--paper); font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; }
  .pin.done { background: var(--jade); }
  .pin.day-1, .pin.day-2 { background: #6d4c8f; }
  .pin.day-3, .pin.day-4, .pin.day-5, .pin.day-6, .pin.day-7 { background: var(--accent); }
  .pin.day-8, .pin.day-9, .pin.day-10, .pin.day-11, .pin.day-12 { background: var(--jade); }
  .pin.day-13, .pin.day-14 { background: var(--sea); }
  .pin.food { width: 20px; height: 20px; background: #b8734a; }
  .pin.food .pin-num { font-size: 9px; }
  .pin.hotel-pin { background: var(--hotel); width: 30px; height: 30px; }
  .pin.airport-pin { background: var(--plane); width: 26px; height: 26px; }
  .pin.active { transform: rotate(-45deg) scale(1.3); box-shadow: 0 0 0 5px rgba(201,93,46,.25), 0 3px 6px rgba(0,0,0,.3); z-index: 1000; }

  .map-legend { position: absolute; top: 8px; right: 8px; background: rgba(253,246,233,.92); backdrop-filter: blur(6px); border: 1px solid var(--line); padding: 6px 10px; font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); z-index: 400; border-radius: 2px; }
  .legend-row { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

  .map-filter { position: absolute; top: 8px; left: 8px; background: rgba(253,246,233,.92); backdrop-filter: blur(6px); border: 1px solid var(--line); padding: 6px 8px; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); z-index: 400; border-radius: 2px; display: flex; gap: 4px; flex-wrap: wrap; }
  .map-filter button { background: transparent; border: 1px solid transparent; padding: 2px 6px; color: var(--mute); font-family: inherit; font-size: inherit; letter-spacing: inherit; cursor: pointer; }
  .map-filter button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .divider { height: 28px; background: var(--paper); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: center; gap: 10px; cursor: ns-resize; touch-action: none; position: relative; z-index: 10; user-select: none; }
  .divider .grip { width: 36px; height: 4px; border-radius: 4px; background: var(--line); }
  .divider .divider-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--mute); }

  .plan-wrap { min-height: 0; overflow: hidden; position: relative; }
  .plan-col { height: 100%; padding: 14px 16px calc(24px + var(--safe-bottom)); overflow-y: auto; -webkit-overflow-scrolling: touch; }

  .meta-card { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: var(--paper-2); border: 1px solid var(--line); border-radius: 3px; margin-bottom: 10px; font-size: 12px; cursor: pointer; }
  .meta-card .ic { font-size: 16px; flex-shrink: 0; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; background: var(--paper); border-radius: 50%; border: 1px solid var(--line); }
  .meta-card .meta-t { flex: 1; }
  .meta-card .meta-name { font-weight: 500; font-size: 13px; line-height: 1.3; }
  .meta-card .meta-desc { font-size: 11px; color: var(--mute); margin-top: 2px; line-height: 1.4; }
  .meta-card.hotel { border-left: 3px solid var(--hotel); }
  .meta-card.transfer { border-left: 3px solid var(--plane); }

  .phase { margin: 20px -16px 14px; padding: 8px 16px; background: linear-gradient(90deg, rgba(201,93,46,.12), transparent); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-family: 'Instrument Serif', serif; font-style: italic; font-size: 20px; color: var(--accent); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .phase .phase-sub { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--mute); font-style: normal; }
  .phase.phangan { background: linear-gradient(90deg, rgba(45,107,90,.12), transparent); color: var(--jade); }

  .day { margin-bottom: 18px; }
  .day-header { display: flex; align-items: baseline; gap: 10px; padding-bottom: 6px; border-bottom: 1px dashed var(--line); margin-bottom: 10px; }
  .day-num { font-family: 'Instrument Serif', serif; font-size: 32px; line-height: 1; color: var(--accent); font-style: italic; }
  .day-meta { flex: 1; min-width: 0; }
  .day-date { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--mute); margin-bottom: 2px; }
  .day-title { font-size: 14px; font-weight: 500; letter-spacing: -.01em; line-height: 1.25; }
  .day-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
  .day-count { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--mute); white-space: nowrap; }

  .weather-pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px; background: var(--paper); border: 1px solid var(--line); border-radius: 20px; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .05em; color: var(--mute); white-space: nowrap; }
  .weather-pill .hi { color: var(--accent); font-weight: 500; }
  .weather-pill .lo { color: var(--sea); }

  .stop { display: flex; gap: 10px; padding: 10px 10px; border: 1px solid transparent; cursor: pointer; margin-bottom: 3px; border-radius: 2px; position: relative; }
  .stop:active { background: var(--paper-2); }
  .stop.active { background: var(--paper-2); border-color: var(--gold); box-shadow: inset 3px 0 0 var(--accent); }
  .stop.done .stop-name { text-decoration: line-through; text-decoration-color: var(--mute); color: var(--mute); }
  .stop.opt { opacity: .75; }

  .checkbox { width: 22px; height: 22px; border: 1.5px solid var(--ink); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--paper); transition: all .3s cubic-bezier(.2,.8,.2,1); margin-top: 1px; }
  .checkbox svg { opacity: 0; transform: scale(.5); transition: all .3s cubic-bezier(.4,1.4,.5,1); }
  .stop.done .checkbox { background: var(--jade); border-color: var(--jade); }
  .stop.done .checkbox svg { opacity: 1; transform: scale(1); stroke: var(--paper); }

  .stop-body { flex: 1; min-width: 0; }
  .stop-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 1px; }
  .stop-name { font-size: 14px; font-weight: 500; letter-spacing: -.01em; line-height: 1.25; }
  .stop-time { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .08em; color: var(--mute); flex-shrink: 0; }
  .stop-tag { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: .12em; text-transform: uppercase; padding: 1px 5px; background: var(--paper); border: 1px solid var(--line); color: var(--mute); margin-top: 4px; margin-right: 3px; }
  .stop-tag.eat { color: var(--accent); border-color: rgba(201,93,46,.3); }
  .stop-tag.view { color: var(--sea); border-color: rgba(30,95,126,.3); }
  .stop-tag.spa { color: var(--lotus); border-color: rgba(232,123,160,.3); }
  .stop-tag.activity { color: var(--jade); border-color: rgba(45,107,90,.3); }
  .stop-tag.must { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .stop-tag.opt { background: transparent; color: var(--mute); border-style: dashed; }
  .stop-hint { font-size: 11px; color: var(--mute); margin-top: 2px; font-style: italic; line-height: 1.4; }

  .detail-overlay { position: fixed; inset: 0; background: rgba(13,46,38,.55); opacity: 0; pointer-events: none; transition: opacity .3s ease; z-index: 500; }
  .detail-overlay.open { opacity: 1; pointer-events: all; }
  .detail-panel { position: fixed; left: 0; right: 0; bottom: 0; max-height: 85vh; max-height: 85dvh; background: var(--paper); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; padding: 8px 22px calc(24px + var(--safe-bottom)); overflow-y: auto; -webkit-overflow-scrolling: touch; transform: translateY(100%); transition: transform .4s cubic-bezier(.2,.8,.2,1); z-index: 501; box-shadow: 0 -20px 60px -20px rgba(0,0,0,.3); }
  .detail-panel.open { transform: translateY(0); }
  .sheet-handle { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 6px auto 16px; }

  .d-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .25em; text-transform: uppercase; color: var(--mute); margin-bottom: 6px; }
  .d-title { font-family: 'Instrument Serif', serif; font-size: 30px; line-height: 1.05; letter-spacing: -.02em; margin-bottom: 8px; }
  .d-address { font-size: 12px; color: var(--mute); font-style: italic; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px dashed var(--line); }
  .d-section { margin-bottom: 16px; }
  .d-section-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); margin-bottom: 5px; }
  .d-section p { font-size: 14px; line-height: 1.5; color: var(--ink); font-weight: 300; }
  .d-btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .d-action { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; background: var(--ink); color: var(--paper); text-decoration: none; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .15em; text-transform: uppercase; border: 1px solid var(--ink); }
  .d-action.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .d-toggle { width: 100%; padding: 13px 18px; background: var(--paper-2); border: 1px solid var(--line); font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; cursor: pointer; color: var(--ink); margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .d-toggle.done-state { background: var(--jade); color: var(--paper); border-color: var(--jade); }

  .route-steps { list-style: none; padding: 0; margin: 6px 0 0; }
  .route-steps li { padding: 8px 0 8px 26px; font-size: 13px; line-height: 1.5; border-bottom: 1px dotted var(--line); position: relative; color: var(--ink); font-weight: 300; }
  .route-steps li:last-child { border-bottom: none; }
  .route-steps li::before { content: attr(data-ic); position: absolute; left: 0; top: 7px; font-size: 14px; }
  .route-steps li strong { font-weight: 500; color: var(--ink); }

  @media (min-width: 900px) {
    .app { grid-template-rows: auto 1fr; grid-template-columns: 1fr 1.1fr; }
    .top { grid-column: 1 / -1; padding: 20px 28px 16px; }
    .plan-wrap { grid-row: 2; grid-column: 1; border-right: 1px solid var(--line); }
    .map-wrap { grid-row: 2; grid-column: 2; }
    .divider { display: none; }
    .brand { font-size: 36px; }
  }

  .intro { position: fixed; inset: 0; background: var(--ink); color: var(--paper); display: flex; align-items: center; justify-content: center; flex-direction: column; z-index: 9999; transition: opacity .6s ease; }
  .intro.hide { opacity: 0; pointer-events: none; }
  .intro h2 { font-family: 'Instrument Serif', serif; font-size: clamp(40px, 14vw, 88px); font-weight: 400; font-style: italic; letter-spacing: -.02em; color: var(--accent-2); }
  .intro .line { width: 40px; height: 1px; background: var(--paper); opacity: .4; margin: 14px 0; }
  .intro p { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .3em; text-transform: uppercase; opacity: .6; }
</style>
</head>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const HOTELS = {

    { id: 'bkk-night', name: 'Bangkok · Son Gece (opsiyonel)', time: 'Akşam', tags: ['eat', 'opt'], tagLabels: { eat: 'OPSİYONEL' }, hint: 'Sky bar + son Thai yemek', lat: 13.7563, lng: 100.5018, address: 'Bangkok merkez', history: 'Otel seçenekleri: Mandarin Oriental (nehir klasik), The Siam (Art Deco butik), Rosewood (modern), Banyan Tree (sky bar). Sky bar: Lebua (Hangover filmi), Vertigo (Banyan Tree 61. kat), Mahanakhon Skywalk (cam zemin).', knowBefore: '5 Haz\'da kalkıyorsan tam 1 gece Bangkok. 4 Haz akşam kalkıyorsan bu durağı atla.', tip: 'Fine dining: Gaggan Anand, Sorn, Le Du.' }
  ]},
  { day: 14, dayLabel: 'Cuma · 5 Haz', theme: '🛬 BKK → İstanbul · Ev', weather: { hi: 23, lo: 16, icon: '🇹🇷', desc: 'İstanbul\'a geri' }, phase: 'transit', stops: [
    { id: 'bkk-dep', name: 'BKK → IST Kalkış', time: 'Sabah', tags: ['must'], tagLabels: { must: 'EV' }, hint: 'TK 69 · BKK → IST · ~10h', lat: 13.6818969, lng: 100.7468694, address: 'BKK', history: 'TK BKK-IST 1988\'den beri aktif. 10 saat uçuş, rüzgarla 9h 30m olabilir.', knowBefore: 'Check-in 3 saat öncesi. Duty-free: Jim Thompson ipek, mango candies, türban.', tip: 'Uçakta Tayland notları yaz — dönüşte v2 yapacağız.' }
  ]}
];

const STORAGE_KEY = 'thailand-itinerary-2026-v1';
let state = { done: {}, splitRatio: 0.5, mapFilter: 'all' };
try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) state = { ...state, ...JSON.parse(raw) }; } catch (e) {}
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }

const allStops = ITINERARY.flatMap(d => d.stops.map(s => ({ ...s, day: d.day, phase: d.phase })));
const markerRefs = {};
const foodMarkers = {};
let activeStopId = null;

const map = L.map('map', { center: [9.7, 100.0], zoom: 10, zoomControl: true, scrollWheelZoom: true, tap: true, zoomSnap: 0.5 });
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { attribution: '© OSM · © CARTO', maxZoom: 19, subdomains: 'abcd' }).addTo(map);

function makeIcon(dayNum, num, isDone) { return L.divIcon({ className: 'map-marker', html: `<div class="pin day-${dayNum} ${isDone ? 'done' : ''}"><span class="pin-num">${num}</span></div>`, iconSize: [26, 26], iconAnchor: [13, 26], popupAnchor: [0, -24] }); }
function makeFoodIcon() { return L.divIcon({ className: 'map-marker', html: `<div class="pin food"><span class="pin-num">🍴</span></div>`, iconSize: [20, 20], iconAnchor: [10, 20], popupAnchor: [0, -18] }); }
function makeHotelIcon() { return L.divIcon({ className: 'map-marker', html: `<div class="pin hotel-pin"><span class="pin-num">🏨</span></div>`, iconSize: [30, 30], iconAnchor: [15, 30], popupAnchor: [0, -28] }); }
function makeAirportIcon() { return L.divIcon({ className: 'map-marker', html: `<div class="pin airport-pin"><span class="pin-num">✈</span></div>`, iconSize: [26, 26], iconAnchor: [13, 26], popupAnchor: [0, -24] }); }

const samuiHotelMarker = L.marker([HOTELS.samui.lat, HOTELS.samui.lng], { icon: makeHotelIcon() }).addTo(map);
samuiHotelMarker.bindPopup(`<strong>🏨 ${HOTELS.samui.name}</strong>`);
samuiHotelMarker.on('click', () => openHotelDetail('samui'));

const phanganHotelMarker = L.marker([HOTELS.phangan.lat, HOTELS.phangan.lng], { icon: makeHotelIcon() }).addTo(map);
phanganHotelMarker.bindPopup(`<strong>🏨 ${HOTELS.phangan.name}</strong>`);
phanganHotelMarker.on('click', () => openHotelDetail('phangan'));

const usmMarker = L.marker([9.5484366, 100.0630279], { icon: makeAirportIcon() }).addTo(map);
usmMarker.bindPopup('<strong>✈ Koh Samui (USM)</strong>');
const bkkMarker = L.marker([13.6818969, 100.7468694], { icon: makeAirportIcon() }).addTo(map);
bkkMarker.bindPopup('<strong>✈ Bangkok (BKK)</strong>');

let globalNum = 0;
allStops.forEach(stop => {
  globalNum++;
  stop.globalNum = globalNum;
  const isDone = !!state.done[stop.id];
  const marker = L.marker([stop.lat, stop.lng], { icon: makeIcon(stop.day, globalNum, isDone) }).addTo(map);
  marker.bindPopup(`<strong>${stop.name}</strong><br><span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#7a7260;">GÜN ${stop.day} · ${stop.time}</span>`);
  marker.on('click', () => openDetail(stop.id));
  markerRefs[stop.id] = marker;
});

FOOD.forEach(f => {
  const marker = L.marker([f.lat, f.lng], { icon: makeFoodIcon() });
  marker.bindPopup(`<strong>🍴 ${f.name}</strong><br><span style="font-size:10px;color:#7a7260;">${f.kind}</span>`);
  marker.on('click', () => openFoodDetail(f.id));
  foodMarkers[f.id] = marker;
});

function applyMapFilter(f) {
  state.mapFilter = f; saveState();
  document.querySelectorAll('.map-filter button').forEach(b => b.classList.toggle('on', b.dataset.filter === f));
  const showStops = f === 'all' || f === 'stops';
  const showFood = f === 'all' || f === 'food';
  Object.values(markerRefs).forEach(m => { if (showStops) map.addLayer(m); else map.removeLayer(m); });
  if (showStops) { map.addLayer(samuiHotelMarker); map.addLayer(phanganHotelMarker); map.addLayer(usmMarker); map.addLayer(bkkMarker); }
  else { map.removeLayer(samuiHotelMarker); map.removeLayer(phanganHotelMarker); map.removeLayer(usmMarker); map.removeLayer(bkkMarker); }
  Object.values(foodMarkers).forEach(m => { if (showFood) map.addLayer(m); else map.removeLayer(m); });
}
document.querySelectorAll('.map-filter button').forEach(btn => btn.addEventListener('click', () => applyMapFilter(btn.dataset.filter)));
applyMapFilter(state.mapFilter);

function renderPlan() {
  const col = document.getElementById('planCol');
  col.innerHTML = '';
  const hotelsEl = document.createElement('div');
  hotelsEl.innerHTML = `
    <div class="meta-card hotel" data-hotel="samui">
      <div class="ic">🏨</div>
      <div class="meta-t"><div class="meta-name">${HOTELS.samui.name}</div><div class="meta-desc">${HOTELS.samui.area} · ${HOTELS.samui.nights}</div></div>
    </div>
    <div class="meta-card hotel" data-hotel="phangan">
      <div class="ic">🏨</div>
      <div class="meta-t"><div class="meta-name">${HOTELS.phangan.name}</div><div class="meta-desc">${HOTELS.phangan.area} · ${HOTELS.phangan.nights}</div></div>
    </div>
  `;
  hotelsEl.querySelectorAll('[data-hotel]').forEach(el => el.addEventListener('click', () => openHotelDetail(el.dataset.hotel)));
  col.appendChild(hotelsEl);

  let lastPhase = '';
  ITINERARY.forEach(day => {
    if (day.phase !== lastPhase) {
      const phaseEl = document.createElement('div');
      const pName = day.phase === 'samui' ? 'Koh Samui' : day.phase === 'phangan' ? 'Koh Phangan' : 'Transit';
      const pSub = day.phase === 'samui' ? '5 gece · Four Seasons' : day.phase === 'phangan' ? '6 gece · Anantara' : 'Uçuş/Transfer';
      phaseEl.className = `phase ${day.phase}`;
      phaseEl.innerHTML = `<span>${pName}</span><span class="phase-sub">${pSub}</span>`;
      col.appendChild(phaseEl);
      lastPhase = day.phase;
    }

    const completed = day.stops.filter(s => state.done[s.id]).length;
    const dayEl = document.createElement('div');
    dayEl.className = 'day';
    const weatherHTML = day.weather ? `<span class="weather-pill"><span>${day.weather.icon}</span><span class="hi">${day.weather.hi}°</span><span>/</span><span class="lo">${day.weather.lo}°</span></span>` : '';
    dayEl.innerHTML = `
      <div class="day-header">
        <div class="day-num">${day.day < 10 ? '0' + day.day : day.day}</div>
        <div class="day-meta">
          <div class="day-date">${day.dayLabel}</div>
          <div class="day-title">${day.theme}</div>
        </div>
        <div class="day-right">
          <div class="day-count">${completed} / ${day.stops.length}</div>
          ${weatherHTML}
        </div>
      </div>
      <div class="day-body"></div>
    `;
    const body = dayEl.querySelector('.day-body');

    if (day.preTransfer) {
      const t = TRANSFERS[day.preTransfer];
      const tEl = document.createElement('div');
      tEl.className = 'meta-card transfer';
      tEl.innerHTML = `<div class="ic">✈️</div><div class="meta-t"><div class="meta-name">${t.title}</div><div class="meta-desc">${t.summary} · <strong>${t.duration}</strong></div></div>`;
      tEl.addEventListener('click', () => openTransferDetail(day.preTransfer));
      body.appendChild(tEl);
    }

    day.stops.forEach(stop => {
      const isDone = !!state.done[stop.id];
      const isActive = activeStopId === stop.id;
      const isOpt = (stop.tags || []).includes('opt');
      const tagHTML = (stop.tags || []).map(t => {
        const cls = t === 'eat' ? 'eat' : t === 'view' ? 'view' : t === 'spa' ? 'spa' : t === 'activity' ? 'activity' : t === 'must' ? 'must' : t === 'opt' ? 'opt' : '';
        return `<span class="stop-tag ${cls}">${stop.tagLabels?.[t] || t}</span>`;
      }).join('');
      const stopEl = document.createElement('div');
      stopEl.className = `stop ${isDone ? 'done' : ''} ${isActive ? 'active' : ''} ${isOpt ? 'opt' : ''}`;
      stopEl.dataset.id = stop.id;
      stopEl.innerHTML = `
        <div class="checkbox" data-check="${stop.id}">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <div class="stop-body">
          <div class="stop-top">
            <div class="stop-name">${stop.name}</div>
            <div class="stop-time">${stop.time}</div>
          </div>
          <div class="stop-hint">${stop.hint}</div>
          <div>${tagHTML}</div>
        </div>
      `;
      stopEl.addEventListener('click', (e) => {
        if (e.target.closest('[data-check]')) { e.stopPropagation(); toggleDone(stop.id); }
        else { openDetail(stop.id); }
      });
      body.appendChild(stopEl);
    });
    col.appendChild(dayEl);
  });
  updateProgress();
}

function updateProgress() {
  const total = allStops.length;
  const done = allStops.filter(s => state.done[s.id]).length;
  document.getElementById('progressText').textContent = `${done} / ${total}`;
  document.getElementById('progressFill').style.width = (total ? (done/total)*100 : 0) + '%';
}

function toggleDone(id) {
  state.done[id] = !state.done[id];
  saveState();
  renderPlan();
  const stop = allStops.find(s => s.id === id);
  if (stop && markerRefs[id]) markerRefs[id].setIcon(makeIcon(stop.day, stop.globalNum, !!state.done[id]));
}

function openDetail(id) {
  const stop = allStops.find(s => s.id === id);
  if (!stop) return;
  activeStopId = id;
  document.querySelectorAll('.stop').forEach(el => el.classList.toggle('active', el.dataset.id === id));
  const isDone = !!state.done[id];
  const gmapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(stop.name + ', Thailand')}`;
  const photosUrl = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(stop.name + ' Thailand')}`;
  document.getElementById('detailContent').innerHTML = `
    <div class="d-eyebrow">Gün ${stop.day} · ${stop.time}</div>
    <h2 class="d-title">${stop.name}</h2>
    <div class="d-address">📍 ${stop.address}</div>
    <div class="d-section"><div class="d-section-label">Kısa Arka Plan</div><p>${stop.history}</p></div>
    <div class="d-section"><div class="d-section-label">Gitmeden Bilinecekler</div><p>${stop.knowBefore}</p></div>
    ${stop.tip ? `<div class="d-section"><div class="d-section-label">💡 İpucu</div><p><em>${stop.tip}</em></p></div>` : ''}
    <div class="d-btn-row">
      <a class="d-action" href="${gmapsUrl}" target="_blank" rel="noopener">🗺 Maps</a>
      <a class="d-action ghost" href="${photosUrl}" target="_blank" rel="noopener">📷 Fotoğraflar</a>
    </div>
    <button class="d-toggle ${isDone ? 'done-state' : ''}" data-check="${stop.id}">
      ${isDone ? '✓ Tamamlandı · geri al' : 'Tamamlandı olarak işaretle'}
    </button>
  `;
  document.querySelector('.d-toggle').addEventListener('click', () => { toggleDone(stop.id); openDetail(stop.id); });
  openSheet();
  map.flyTo([stop.lat, stop.lng], 13, { duration: 0.7 });
  setTimeout(() => markerRefs[stop.id]?.openPopup(), 800);
}

function openFoodDetail(id) {
  const f = FOOD.find(x => x.id === id);
  if (!f) return;
  const gmapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(f.name + ', Thailand')}`;
  const photosUrl = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(f.name + ' Thailand')}`;
  document.getElementById('detailContent').innerHTML = `
    <div class="d-eyebrow">🍴 ${f.area} · ${f.kind}</div>
    <h2 class="d-title">${f.name}</h2>
    <div class="d-address">${f.note}</div>
    <div class="d-btn-row">
      <a class="d-action" href="${gmapsUrl}" target="_blank" rel="noopener">🗺 Maps</a>
      <a class="d-action ghost" href="${photosUrl}" target="_blank" rel="noopener">📷 Fotoğraflar</a>
    </div>
  `;
  openSheet();
  if (state.mapFilter === 'stops') applyMapFilter('all');
  map.flyTo([f.lat, f.lng], 13, { duration: 0.7 });
  setTimeout(() => foodMarkers[f.id]?.openPopup(), 800);
}

function openHotelDetail(key) {
  const h = HOTELS[key];
  const website = key === 'samui' ? 'https://www.fourseasons.com/kohsamui/' : 'https://www.anantara.com/en/rasananda-koh-phangan';
  const gmaps = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(h.name)}`;
  document.getElementById('detailContent').innerHTML = `
    <div class="d-eyebrow">🏨 Konaklama · ${h.nights}</div>
    <h2 class="d-title">${h.name}</h2>
    <div class="d-address">📍 ${h.address}</div>
    <div class="d-section"><div class="d-section-label">Özellik</div><p>${h.info}</p></div>
    <div class="d-section"><div class="d-section-label">💡 Alternatifler</div><p><em>${h.tip}</em></p></div>
    <div class="d-btn-row">
      <a class="d-action" href="${website}" target="_blank" rel="noopener">🌐 Web</a>
      <a class="d-action ghost" href="${gmaps}" target="_blank" rel="noopener">🗺 Maps</a>
    </div>
  `;
  openSheet();
  map.flyTo([h.lat, h.lng], 13, { duration: 0.7 });
}

function openTransferDetail(key) {
  const t = TRANSFERS[key];
  const stepsHTML = t.steps.map(s => `<li data-ic="${s.ic}">${s.text}</li>`).join('');
  document.getElementById('detailContent').innerHTML = `
    <div class="d-eyebrow">✈️ Transfer</div>
    <h2 class="d-title">${t.title}</h2>
    <div class="d-section"><div class="d-section-label">Özet</div><p><strong>${t.summary}</strong><br><em>Tahmini: ${t.duration}</em></p></div>
    <div class="d-section"><div class="d-section-label">Adım Adım</div><ul class="route-steps">${stepsHTML}</ul></div>
  `;
  openSheet();
}

function openSheet() { document.getElementById('detailPanel').classList.add('open'); document.getElementById('overlay').classList.add('open'); }
function closeDetail() { document.getElementById('detailPanel').classList.remove('open'); document.getElementById('overlay').classList.remove('open'); activeStopId = null; document.querySelectorAll('.stop').forEach(el => el.classList.remove('active')); }
document.getElementById('overlay').addEventListener('click', closeDetail);

let touchStartY = 0, touchDelta = 0;
const panel = document.getElementById('detailPanel');
panel.addEventListener('touchstart', (e) => { if (panel.scrollTop > 0) return; touchStartY = e.touches[0].clientY; touchDelta = 0; }, { passive: true });
panel.addEventListener('touchmove', (e) => { if (panel.scrollTop > 0) return; touchDelta = e.touches[0].clientY - touchStartY; if (touchDelta > 0) panel.style.transform = `translateY(${touchDelta}px)`; }, { passive: true });
panel.addEventListener('touchend', () => { if (touchDelta > 100) closeDetail(); panel.style.transform = ''; touchDelta = 0; }, { passive: true });

document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('Tüm işaretleri sıfırla?')) return;
  state.done = {}; saveState();
  allStops.forEach(stop => markerRefs[stop.id].setIcon(makeIcon(stop.day, stop.globalNum, false)));
  renderPlan();
});

const divider = document.getElementById('divider');
const appEl = document.getElementById('app');
function applyRatio(ratio) {
  ratio = Math.max(0.2, Math.min(0.75, ratio));
  state.splitRatio = ratio;
  if (window.innerWidth < 900) appEl.style.gridTemplateRows = `auto ${ratio}fr 28px ${1 - ratio}fr`;
  setTimeout(() => map.invalidateSize(), 50);
}
let dragging = false, startY = 0, startRatio = 0.5;
function startDrag(y) { dragging = true; startY = y; startRatio = state.splitRatio; document.body.style.cursor = 'ns-resize'; }
function moveDrag(y) { if (!dragging) return; applyRatio(startRatio + (y - startY) / appEl.clientHeight); }
function endDrag() { if (!dragging) return; dragging = false; document.body.style.cursor = ''; saveState(); }
divider.addEventListener('mousedown', (e) => { startDrag(e.clientY); e.preventDefault(); });
window.addEventListener('mousemove', (e) => moveDrag(e.clientY));
window.addEventListener('mouseup', endDrag);
divider.addEventListener('touchstart', (e) => startDrag(e.touches[0].clientY), { passive: true });
window.addEventListener('touchmove', (e) => { if (dragging) { moveDrag(e.touches[0].clientY); e.preventDefault(); } }, { passive: false });
window.addEventListener('touchend', endDrag);

applyRatio(state.splitRatio);
window.addEventListener('resize', () => applyRatio(state.splitRatio));

renderPlan();
map.fitBounds([[9.4, 99.6], [9.9, 100.2]], { padding: [20, 20] });
setTimeout(() => { document.getElementById('intro').classList.add('hide'); map.invalidateSize(); }, 900);
setTimeout(() => { const i = document.getElementById('intro'); if (i) i.remove(); }, 1600);
</script>
</body>
</html>
